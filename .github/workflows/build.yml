name: Build Windows Geode mod
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mod.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Win64
          sdk: given
          bindings-ref: 7f6c2a75742856de88dad354e576dcff8a28e881
      - name: Upload Windows mod
        uses: actions/upload-artifact@v4
        with:
          name: smartjump-windows-prototype
          path: ${{ steps.build.outputs.build-output }}
