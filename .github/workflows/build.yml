name: Build Windows Geode mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Win64
          sdk: latest
          bindings-ref: f8aec5d1f3df76d840dfd2609f02cef30dc6efdf
      - name: Upload Windows mod
        uses: actions/upload-artifact@v4
        with:
          name: smartjump-windows-prototype
          path: ${{ steps.build.outputs.build-output }}
