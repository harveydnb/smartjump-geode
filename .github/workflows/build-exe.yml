name: Build Windows EXE launcher
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone Windows executable
        run: dotnet publish launcher/SmartJumpLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o output
      - uses: actions/upload-artifact@v4
        with:
          name: SmartJumpLauncher-Windows-x64
          path: output/SmartJumpLauncher.exe
          if-no-files-found: error
